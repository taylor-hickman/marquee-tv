name: Card review

# A pull request that changes code merges only after a reviewer agent's
# `Card review:` comment on its latest commit lists no open finding (build plan
# 4.1). pull_request_target and issue_comment both run this file as it is on
# main and check out no code, so a pull request can't change the gate it's
# judged by.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created, edited, deleted]

permissions:
  pull-requests: read
  statuses: write

concurrency:
  group: card-review-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  # The ruleset requires the commit status `card-review`, set below. The job
  # has another name so its own check run never satisfies that rule.
  evaluate:
    if: github.event_name == 'pull_request_target' || github.event.issue.pull_request
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          set -euo pipefail
          pr=$(gh api "repos/$REPO/pulls/$PR")
          [[ $(jq -r .state <<<"$pr") == open ]] || exit 0
          sha=$(jq -r .head.sha <<<"$pr")

          status() {
            gh api "repos/$REPO/statuses/$sha" --silent \
              -f state="$1" -f context=card-review -f description="$2"
            echo "$1: $2"
          }

          if [[ $(jq -r .user.login <<<"$pr") == 'dependabot[bot]' ]]; then
            status success "Dependabot update"
            exit 0
          fi
          code=$(gh api --paginate "repos/$REPO/pulls/$PR/files" \
            --jq '.[] | .filename, (.previous_filename // empty)' | grep -cv '^docs/' || true)
          if [[ $code == 0 ]]; then
            status success "Only docs/ changed"
            exit 0
          fi

          # Red, never pending, until a review exists: an agent waiting for
          # checks to finish would otherwise wait on this one forever.
          # The latest comment whose first line is `Card review: <sha>` naming
          # the head commit. Comment bodies are data: they only go through jq.
          review=$(gh api --paginate "repos/$REPO/issues/$PR/comments" --jq '.[]' |
            jq -s --arg sha "$sha" '
              map(select(.body | test("^Card review: [0-9a-f]{7,40}\\b"))
                | select((.body | capture("^Card review: (?<s>[0-9a-f]{7,40})").s) as $s
                    | $sha | startswith($s)))
              | sort_by(.created_at) | last')
          if [[ $review == null ]]; then
            status failure "No card review of ${sha:0:7}: run build plan 4.1"
            exit 0
          fi

          # An open finding is an unticked task-list item.
          open=$(jq -r .body <<<"$review" | grep -cE '^[[:space:]]*[-*] \[ \]' || true)
          if (( open > 0 )); then
            status failure "$open open finding(s) on ${sha:0:7}: fix, push, review again"
          else
            status success "Card review of ${sha:0:7} has no open finding"
          fi
