name: Expire passes

# Nightly, pass drafts whose seven days are up become read_only, in staging and
# in production (PRD 16.1). Scheduled jobs run on Actions (ADR 0005).
on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  expire-passes:
    strategy:
      fail-fast: false
      matrix:
        environment: [preview, production]
    runs-on: ubuntu-latest
    environment: ${{ matrix.environment }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm expire-passes
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
