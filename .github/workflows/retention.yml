name: Retention

# Nightly (architecture 4, PRD 7.6): deletes unclaimed guest drafts 30 days
# after last activity, on staging and production.
on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retention:
    strategy:
      fail-fast: false
      matrix:
        environment: [preview, production]
    runs-on: ubuntu-latest
    environment: ${{ matrix.environment }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/retention/retention.mts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
