name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to a pull request cancels its older run. Runs on main all finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # The main ruleset requires this job by name (build plan 4.1).
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: supabase/setup-cli@v1
        with:
          version: 2.113.0
      # Only what the db tests touch: Postgres, the API gateway, PostgREST and Auth.
      - run: supabase start -x studio,imgproxy,mailpit,realtime,storage-api,postgres-meta,edge-runtime,logflare,vector,supavisor
      - run: pnpm seed
      - run: pnpm check
      - name: Coverage summary
        if: always() && hashFiles('coverage/coverage.txt') != ''
        run: |
          {
            echo '### Coverage'
            echo '```'
            cat coverage/coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  e2e:
    runs-on: ubuntu-latest
    services:
      stripe-mock:
        image: stripe/stripe-mock:v0.206.0
        ports:
          - 12111:12111
    env:
      LLM_ADAPTER: fake
      STRIPE_API_BASE: http://localhost:12111
      # The local stack's fixed development credentials, not a secret.
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: supabase/setup-cli@v1
        with:
          version: 2.113.0
      # What e2e touches: Postgres, the API gateway, PostgREST, Auth and mail.
      # Playwright's global setup (e2e/support/db.ts) empties and seeds it.
      - run: supabase start -x studio,imgproxy,realtime,storage-api,postgres-meta,edge-runtime,logflare,vector,supavisor
      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  # Joins the required checks once it has run on main (build plan 4.1).
  migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: db/check-migrations.sh "origin/${GITHUB_BASE_REF:-main}"
      - uses: supabase/setup-cli@v1
        with:
          version: 2.113.0
      # An empty Postgres, then every file in supabase/migrations, in order.
      - run: supabase db start

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: changes
        with:
          filters: |
            github:
              - '.github/**'
      - if: steps.changes.outputs.github == 'true'
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color
