name: Deploy

# The only path to production (build plan 6.3): after CI passes on a push to
# main, migrate staging, migrate production, then deploy. vercel.json turns off
# Vercel's own Git deploys for main.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

# One `supabase db push` at a time (ADR 0006), and deploys land in merge order.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  staging:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    environment: preview
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: supabase/setup-cli@v3
        with:
          version: 2.113.0
      # DATABASE_URL is the transaction pooler (6543); migrations run in
      # session mode on the same host (docs/ops/provisioning.md).
      - run: supabase db push --yes --db-url "${DATABASE_URL/:6543\//:5432/}"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # staging.getmarquee.tv serves the staging branch, and Stripe's preview
      # webhook posts there, so the branch follows main onto the migrated
      # staging database. Vercel's Git integration builds it.
      - run: gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/staging" -f sha="$SHA" -F force=true --silent
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}

  production:
    needs: staging
    runs-on: ubuntu-latest
    environment: production
    env:
      VERCEL_ORG_ID: team_eyBWXF3LSFu9dTiEXvRzk1yi
      VERCEL_PROJECT_ID: prj_3UQEg2z3T07E7iJUOAvoaEvmoYeY
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: supabase/setup-cli@v3
        with:
          version: 2.113.0
      - run: supabase db push --yes --db-url "${DATABASE_URL/:6543\//:5432/}"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      # Vercel builds it with the Production environment's variables.
      - run: npx --yes vercel@65.14.0 deploy --prod --yes --token "$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
